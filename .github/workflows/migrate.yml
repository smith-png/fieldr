name: Migrate Supabase
on: workflow_dispatch
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump old project data
        env:
          OLD: ${{ secrets.OLD_DB_URL }}
        run: |
          supabase db dump --db-url "$OLD" -f data.sql --use-copy --data-only -x "storage.*"

      - name: Restore into new project
        env:
          NEW: ${{ secrets.NEW_DB_URL }}
        run: |
          psql "$NEW" -v ON_ERROR_STOP=1 -c "delete from auth.users;"
          psql "$NEW" --single-transaction -v ON_ERROR_STOP=1 -c "SET session_replication_role = replica" -f data.sql

      - name: Compare counts
        env:
          OLD: ${{ secrets.OLD_DB_URL }}
          NEW: ${{ secrets.NEW_DB_URL }}
        run: |
          Q="select (select count(*) from auth.users) as users, (select count(*) from public.players) as players, (select count(*) from public.teams) as teams"
          echo "OLD:"; psql "$OLD" -c "$Q"
          echo "NEW:"; psql "$NEW" -c "$Q"
